name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer --no-plugins validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpunit
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Verify committed frontend assets
        run: |
          git diff --exit-code -- public/build
          test -z "$(git ls-files --others --exclude-standard -- public/build)"
